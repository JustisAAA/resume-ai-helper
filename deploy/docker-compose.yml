# 简历面试AI助手 - Docker Compose 编排
# 包含：PostgreSQL数据库 + 应用服务
# 用法：docker compose up -d

version: "3.8"

services:
  # ===== PostgreSQL 数据库 =====
  db:
    image: postgres:16-alpine
    container_name: resume-ai-db
    restart: always
    environment:
      POSTGRES_USER: resume_ai
      POSTGRES_PASSWORD: ResumeAI@2026
      POSTGRES_DB: resume_ai
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resume_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ===== 应用服务（前后端一体） =====
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: resume-ai-app
    restart: always
    ports:
      - "3002:3002"
    environment:
      # 数据库连接（PostgreSQL）
      DATABASE_URL: postgresql://resume_ai:ResumeAI@2026@db:5432/resume_ai
      # JWT密钥（务必修改！）
      JWT_SECRET: resume-ai-helper-jwt-secret-key-2026-production-change-this
      # 运行模式
      NODE_ENV: production
      # 腾讯元器API配置（从Railway迁移过来）
      YUANQI_BASE_URL: https://yuanqi.tencent.com/openapi/v1
      YUANQI_APPID: 2047291498014477504
      YUANQI_APPKEY: bIVToDNxA4s86cn2xe9FFs5jcOl3xWI4
      YUANQI_ENTERPRISE_APPID: 2063433671104457792
      YUANQI_ENTERPRISE_APPKEY: gFipTXPk9YpEnICQCsRh4O2c6WPOq1Mi
      # 上传目录
      UPLOAD_PATH: /app/backend3/uploads
    volumes:
      - upload-data:/app/backend3/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  upload-data:
