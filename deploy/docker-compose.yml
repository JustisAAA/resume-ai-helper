# 简历面试AI助手 - Docker Compose 编排
# 包含：PostgreSQL数据库 + 应用服务
# 用法：docker compose up -d
# 敏感配置通过 deploy/.env 提供（.env 已被 gitignore，不会进 GitHub）

services:
  # ===== PostgreSQL 数据库 =====
  db:
    image: postgres:16-alpine
    container_name: resume-ai-db
    restart: always
    environment:
      POSTGRES_USER: resume_ai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: resume_ai
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resume_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ===== 应用服务（前后端一体） =====
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: resume-ai-app
    restart: always
    ports:
      - "3002:3002"
    environment:
      # 数据库连接（PostgreSQL）
      DATABASE_URL: postgresql://resume_ai:${POSTGRES_PASSWORD}@db:5432/resume_ai
      # JWT密钥
      JWT_SECRET: ${JWT_SECRET}
      # 运行模式
      NODE_ENV: production
      # 腾讯元器API配置
      YUANQI_BASE_URL: https://yuanqi.tencent.com/openapi/v1
      YUANQI_APPID: ${YUANQI_APPID}
      YUANQI_APPKEY: ${YUANQI_APPKEY}
      YUANQI_ENTERPRISE_APPID: ${YUANQI_ENTERPRISE_APPID}
      YUANQI_ENTERPRISE_APPKEY: ${YUANQI_ENTERPRISE_APPKEY}
      # 上传目录
      UPLOAD_PATH: /app/backend3/uploads
    volumes:
      - upload-data:/app/backend3/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  upload-data:
